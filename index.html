function renderBoard() {
  const grid = document.getElementById('board-grid');
  grid.innerHTML = '';
  // headers
  CATEGORIES.forEach((cat, ci) => {
    const el = document.createElement('div');
    el.className = 'bh';
    el.textContent = cat;
    grid.appendChild(el);
  });
  // cells
  POINTS.forEach((pts, pi) => {
    CATEGORIES.forEach((cat, ci) => {
      const el = document.createElement('div');
      const isUsed = usedCells[ci][pi];
      const isSel = currentSel && currentSel.catIdx === ci && currentSel.ptIdx === pi;
      el.className = 'bc' + (isUsed ? ' used' : '') + (isSel ? ' sel' : '');
      el.textContent = isUsed ? '' : '$' + pts;
      if (!isUsed) el.onclick = () => selectCell(ci, pi);
      grid.appendChild(el);
    });
  });
}

  const cat = CATEGORIES[ci];
  const pts = POINTS[pi];
  currentSel = { catIdx: ci, ptIdx: pi };
  const qdata = BOARD_DATA[cat][pts];
  currentQ = { cat, pts, catIdx: ci, ptIdx: pi, ...qdata };
  displayMode = 'board';
  resetButtonStates();
  renderBoard();
  renderQuestionPanel();
}

function renderQuestionPanel() {
  if (!currentQ) return;
  document.getElementById('qp-ph').style.display = 'none';
  document.getElementById('qp-content').style.display = '';
  document.getElementById('qp-hdr').textContent = currentQ.cat + ' — $' + currentQ.pts;
  document.getElementById('qp-text').textContent = currentQ.q;
  document.getElementById('qp-def').textContent = currentQ.def;

  const grid = document.getElementById('opts-grid');
  grid.innerHTML = '';
  ['A','B','C','D'].forEach(l => {
    const el = document.createElement('div');
    el.className = 'opt' + (l === currentQ.ans ? ' correct' : '');
    el.innerHTML = `<span class="ltr">${l}</span><span class="otxt">${currentQ.opts[l]}</span>`;
    grid.appendChild(el);
  });
}

function resetButtonStates() {
  document.getElementById('btn-showq').classList.remove('active');
  document.getElementById('btn-showa').classList.remove('active');
}

/* ════════════════════════════════════════════════
   NTFY MESSAGING
════════════════════════════════════════════════ */
function ntfySend(body) {
  fetch(NTFY_URL, { method: 'POST', body, headers: { 'Content-Type': 'text/plain' } }).catch(() => {});
}

function pushToDisplay(mode) {
  if (!currentQ) return;
  displayMode = mode;
  const payload = JSON.stringify({
    mode, q: currentQ.q, opts: currentQ.opts,
    ans: currentQ.ans, def: currentQ.def,
    cat: currentQ.cat, pts: currentQ.pts
  });
  ntfySend('DISPLAY:' + payload);
  document.getElementById('btn-showq').classList.toggle('active', mode === 'question');
  document.getElementById('btn-showa').classList.toggle('active', mode === 'answer');
}

function clearDisplay() {
  ntfySend('DISPLAY:' + JSON.stringify({ mode: 'clear' }));
  displayMode = 'board';
  resetButtonStates();
}

function pushBoardState() {
  const payload = JSON.stringify({
    used: usedCells,
    teams: teams.map(t => ({ name: t.name, score: t.score }))
  });
  ntfySend('BOARD:' + payload);
}

/* ════════════════════════════════════════════════
   BUZZ
════════════════════════════════════════════════ */
function handleBuzz(name) {
  if (buzzedTeam) return; // first buzz wins
  buzzedTeam = name;
  const disp = document.getElementById('buzz-disp');
  disp.className = 'buzz-disp';
  disp.textContent = '🔔 ' + name;
  // highlight matching team row
  document.querySelectorAll('.team-row').forEach(row => {
    const inp = row.querySelector('.t-name');
    if (inp && inp.value.trim() === name.trim()) row.classList.add('buzzed');
    else row.classList.remove('buzzed');
  });
}

function judgeAnswer(correct) {
  if (!currentQ || !buzzedTeam) return;
  const pts = currentQ.pts;
  // find matching team
  const team = teams.find(t => t.name.trim() === buzzedTeam.trim());
  if (team) {
    team.score += correct ? pts : -pts;
    renderTeams();
    pushBoardState();
  }
  resetBuzzers();
  if (correct) markUsed();
}

function resetBuzzers() {
  buzzedTeam = null;
  const disp = document.getElementById('buzz-disp');
  disp.className = 'buzz-disp empty';
  disp.textContent = 'Waiting…';
  document.querySelectorAll('.team-row').forEach(row => row.classList.remove('buzzed'));
  ntfySend('RESET');
}

/* ════════════════════════════════════════════════
   BOARD MANAGEMENT
════════════════════════════════════════════════ */
function markUsed() {
  if (!currentQ) return;
  usedCells[currentQ.catIdx][currentQ.ptIdx] = true;
  currentSel = null;
  renderBoard();
  pushBoardState();
  // hide question panel
  document.getElementById('qp-ph').style.display = '';
  document.getElementById('qp-content').style.display = 'none';
  currentQ = null;
  resetButtonStates();
}

function newGame() {
  if (!confirm('Start a new game? This will reset the board and all scores.')) return;
  usedCells = CATEGORIES.map(() => POINTS.map(() => false));
  teams.forEach(t => t.score = 0);
  currentQ = null;
  currentSel = null;
  buzzedTeam = null;
  displayMode = 'board';
  renderBoard();
  renderTeams();
  document.getElementById('qp-ph').style.display = '';
  document.getElementById('qp-content').style.display = 'none';
  document.getElementById('buzz-disp').className = 'buzz-disp empty';
  document.getElementById('buzz-disp').textContent = 'Waiting…';
  resetButtonStates();
  pushBoardState();
}

function resetScores() {
  if (!confirm('Reset all scores to zero?')) return;
  teams.forEach(t => t.score = 0);
  renderTeams();
  pushBoardState();
}

/* ════════════════════════════════════════════════
   TEAM MANAGEMENT
════════════════════════════════════════════════ */
function addTeam() {
  teams.push({ name: 'Team ' + (teams.length + 1), score: 0 });
  renderTeams();
}

function removeTeam(idx) {
  if (teams.length <= 1) return;
  teams.splice(idx, 1);
  renderTeams();
}

function syncTeam(idx) {
  const row = document.getElementById('trow-' + idx);
  if (!row) return;
  const nameVal = row.querySelector('.t-name').value;
  const scoreVal = parseInt(row.querySelector('.t-score').value) || 0;
  teams[idx].name = nameVal;
  teams[idx].score = scoreVal;
}

function saveScoreEdit(idx) {
  syncTeam(idx);
  pushBoardState();
}

function renderTeams() {
  const list = document.getElementById('teams-list');
  list.innerHTML = '';
  teams.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'team-row';
    row.id = 'trow-' + i;
    row.innerHTML = `
      <input class="t-name" type="text" value="${escHtml(t.name)}"
        onblur="saveScoreEdit(${i})" onchange="syncTeam(${i})">
      <input class="t-score" type="number" value="${t.score}"
        onblur="saveScoreEdit(${i})" onchange="syncTeam(${i})">
      <button class="t-del" onclick="removeTeam(${i})" title="Remove">×</button>
    `;
    list.appendChild(row);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════════
   NTFY CONNECTION
════════════════════════════════════════════════ */
function connectNtfy() {
  if (sse) { try { sse.close(); } catch {} }
  sse = new EventSource(NTFY_URL + '/sse');
  sse.onopen = () => {
    const s = document.getElementById('ntfy-status');
    s.textContent = 'Connected'; s.className = 'ntfy-status ok';
  };
  sse.onerror = () => {
    const s = document.getElementById('ntfy-status');
    s.textContent = 'Reconnecting…'; s.className = 'ntfy-status';
    setTimeout(connectNtfy, 4000);
  };
  sse.onmessage = e => {
    try {
      const data = JSON.parse(e.data);
      const msg = (data.message || '').trim();
      if (msg.startsWith('BUZZ:')) {
        const parts = msg.split(':');
        const name = parts.slice(2).join(':');
        handleBuzz(name);
      }
      // ignore DISPLAY/BOARD/RESET echoes — we sent them
    } catch {}
  };
}

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
renderBoard();
renderTeams();
connectNtfy();
</script>
</body>
</html>
